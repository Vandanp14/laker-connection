<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Couldn't do that</title>
    <link rel="stylesheet" href="/static/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-title">
                <span class="topbar-mark">●</span>
                <h1>Laker Connection</h1>
            </div>
            <nav class="topbar-nav">
                <a href="/">Dashboard</a>
            </nav>
        </header>

        <div class="banner banner-error">
            <div class="banner-title">{{ message }}</div>
            {% if details %}
            <ul>
                {% for detail in details %}
                    <li>{{ detail }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>

        <a class="back-link" href="/">← Back to dashboard, nothing was saved</a>
    </div>
</body>
</html>
